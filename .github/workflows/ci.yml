name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: ReliveCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: Packages/ReliveCore
        run: swift test

  ios:
    name: iOS app build (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: ReliveCore tests (macOS)
        run: swift test --package-path Packages/ReliveCore
      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Relive.xcodeproj \
            -scheme Relive \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Summarize diagnostics
        if: always()
        run: |
          echo "Errors:   $(grep -c 'error:' build/xcodebuild.log || true)"
          echo "Warnings: $(grep -c 'warning:' build/xcodebuild.log || true)"
          grep -E "error:|warning:" build/xcodebuild.log | sort -u | head -200 || true
