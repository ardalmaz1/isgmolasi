name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: ReliveCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: Packages/ReliveCore
        run: swift test

  ios-build:
    name: iOS build (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.4", "26"]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" = "26" ]; then
            XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          else
            XCODE="/Applications/Xcode_${{ matrix.xcode }}.app"
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: ReliveCore tests (macOS)
        run: swift test --package-path Packages/ReliveCore
      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Relive.xcodeproj \
            -scheme Relive \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Summarize diagnostics
        if: always()
        run: |
          echo "Errors:   $(grep -c 'error:' build/xcodebuild.log || true)"
          echo "Warnings: $(grep -c 'warning:' build/xcodebuild.log || true)"
          grep -E "error:|warning:" build/xcodebuild.log | sort -u | head -200 || true

  ui-flow:
    name: End-to-end flow (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Generate sample photo library
        run: |
          brew install exiftool >/dev/null
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow
          build/venv/bin/python scripts/make_sample_library.py build/SampleLibrary
      - name: Prepare simulator
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-18") and r.get("isAvailable")]; print(sorted(rs, key=lambda r: [int(p) for p in r["version"].split(".")])[-1]["identifier"])')"
          echo "Runtime: $RUNTIME"
          UDID="$(xcrun simctl create ReliveCI "iPhone 16" "$RUNTIME")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl addmedia "$UDID" build/SampleLibrary/*.jpg
          xcrun simctl privacy "$UDID" grant photos app.relive.prototype
          xcrun simctl privacy "$UDID" grant photos-add app.relive.prototype || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: App unit tests (hosted)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Relive.xcodeproj \
            -scheme Relive \
            -destination "id=$UDID" \
            -only-testing:ReliveTests \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AppUnitTests.xcresult \
            2>&1 | tee build/unittest.log | grep -E "error:|warning:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/unittest.log
      - name: Run UI flow
        run: |
          set -o pipefail
          xcodebuild test \
            -project Relive.xcodeproj \
            -scheme Relive \
            -destination "id=$UDID" \
            -only-testing:ReliveUITests \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UIFlow.xcresult \
            2>&1 | tee build/uitest.log | grep -E "error:|TIMELINE|SCREEN|Test Case|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/uitest.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UIFlow.xcresult --output-path build/screenshots || true
          ls -la build/screenshots || true
      - name: Screenshot thumbnails (for review from environments without artifact access)
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          root = pathlib.Path("build/screenshots")
          manifest = root / "manifest.json"
          if not manifest.exists():
              raise SystemExit(0)
          found = []
          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node and "suggestedHumanReadableName" in node:
                      found.append((node["suggestedHumanReadableName"], node["exportedFileName"]))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(json.loads(manifest.read_text()))
          wanted = ("08-", "15-", "C01-", "C02-", "C03-", "C04-", "C05-", "C07-", "C08-", "C09-", "C11-", "C13-", "C15-")
          for name, file in sorted(found):
              if not name.startswith(wanted) or not file.endswith(".png"):
                  continue
              thumb = root / (name.split("_")[0] + ".jpg")
              subprocess.run(["sips", "-Z", "440", "-s", "format", "jpeg", "-s", "formatOptions", "50",
                              str(root / file), "--out", str(thumb)], check=True, capture_output=True)
              data = base64.b64encode(thumb.read_bytes()).decode()
              print(f"THUMB-BEGIN {thumb.name}")
              for i in range(0, len(data), 4000):
                  print(data[i:i + 4000])
              print(f"THUMB-END {thumb.name}")
          PY
      - name: App log excerpt
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 15m --info --style compact --predicate 'subsystem == "app.relive"' | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-flow-screenshots
          path: build/screenshots
          if-no-files-found: warn
